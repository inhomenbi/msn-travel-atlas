.gate .btn { width: 100%; height: 50px; font-size: 16px; } .gate .big { font-size: 48px; } .gate .msg { color: var(--warn); font-size: 14px; min-height: 20px; margin-top: 8px; }

<body>
<section class="lock" id="lock">
  <div class="box">
    <img class="logo" id="lockLogo" alt="" hidden><h1 id="lockTitle">خريطتك السياحية</h1>
    <p id="lockText">أدخل الرقم السري الذي أرسلته لك الوكالة لفتح خريطتك.</p>
    <form id="form"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" aria-label="الرقم السري" required>
    <input id="who" class="who" maxlength="40" autocomplete="name" placeholder="اسمك (اختياري، يشوفه قائد الرحلة)" aria-label="اسمك">
    <button class="btn" type="submit">افتح الخريطة</button></form>
    <div class="msg" id="msg" role="alert"></div>
    <button class="btn ghost homebtn" id="homeBtnL" type="button" hidden>📲 أضف «خارطتي» للشاشة الرئيسية</button>
  </div>
</section>
<main class="trip" id="trip"></main>

<script src="../../geo.js?v=mw281u6l"></script>
<script>
// Map page t/m/#<id>. The map's settings and secret codes live in k/<id>.json, written by the agency's settings file:
// the settings are sealed (AES-GCM) with a data key, and each code slot holds that key plus the code's expiry time,
// sealed with a key derived from the code (PBKDF2-SHA256). When a code's time runs out the page locks itself and asks
// for a new code. The file is fetched fresh when online and kept on the phone for offline use; a deleted map stops opening.
// The map id is after #. A home-screen icon may open the page without it, so the last map opened here is remembered.
const ID = (() => { let id = location.hash.slice(1).replace(/[^\w-]/g, "");
  try { if (id) localStorage.setItem("map-last-id", id); else if ((id = localStorage.getItem("map-last-id") || "")) history.replaceState(null, "", "#" + id); } catch {}
  return id; })();
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const KEY = "map-code-" + ID, FILE = `k/${ID}.json`, CACHE = "trip-m-" + ID;
// Clock that cannot be wound back: every time the page is online it keeps the internet time (the server's Date header),
// and "now" is never earlier than the latest internet time seen. Setting the phone's date back after that does not
// bring an expired code back to life.
const NET = "map-net-time";
const netSeen = () => { try { return +localStorage.getItem(NET) || 0; } catch { return 0; } };
const now = () => Math.max(Date.now(), netSeen());
// The agency's name and logo are sealed with the map; kept on the phone after the first opening so the lock screen shows them.
const BRAND = "map-brand-" + ID, brandOf = T => ({ name: T.brand || "MSN Travel", logo: T.logo || "" });
try { const b = JSON.parse(localStorage.getItem(BRAND)); if (b) { $("lockTitle").textContent = "خريطتك السياحية من " + b.name; document.title = b.name;
  if (b.logo) { $("lockLogo").src = b.logo; $("lockLogo").hidden = false; } } } catch {}
const store = { get: () => { try { return localStorage.getItem(KEY); } catch { return null; } },
  set: v => { try { localStorage.setItem(KEY, v); } catch {} }, del: () => { try { localStorage.removeItem(KEY); } catch {} } };
const MSG = { code: "الرقم السري غير صحيح، حاول مرة أخرى.", expired: "انتهت صلاحية الرقم السري. اطلب رقماً جديداً من الوكالة وأدخله هنا.",
  gone: "أوقفت الوكالة هذه الخريطة.", stopped: "أوقفت الوكالة هذا الرقم السري. اطلب رقماً جديداً وأدخله هنا.", offline: "اتصل بالإنترنت مرة واحدة لفتح الخريطة أول مرة.", srvdown: "تعذر الاتصال بسيرفر الوكالة. اتصل بالإنترنت وحاول مرة ثانية.",
  full: "اكتمل عدد الأجهزة المسموح لهذا الرقم السري. اطلب من الوكالة رقماً آخر.", kicked: "أوقفت الوكالة أو قائد الرحلة الخريطة على هذا الجهاز. تواصل معهم.", data: "تعذر تحميل بيانات الخريطة. اتصل بالإنترنت ثم حاول." };
const fmtLeft = ms => { const m = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
  return [d && d + " يوم", h && h + " ساعة", (m % 60 || !(d || h)) && (m % 60) + " دقيقة"].filter(Boolean).join(" و").replace(/^0 دقيقة$/, "أقل من دقيقة"); };

if (!ID) askLink();
else {
  try { const [id, why] = (sessionStorage.getItem("map-expired") || "").split("|");
    if (id === ID) { sessionStorage.removeItem("map-expired"); $("msg").textContent = MSG[why] || MSG.expired; } } catch {}
  const saved = store.get(); if (saved) unlock(saved, true);
  $("form").addEventListener("submit", e => { e.preventDefault(); unlock($("code").value.trim(), false); });
}

// No link after # (a home-screen icon can open the page without it): the traveler pastes the link from the agency's message.
function askLink() {
  $("lockText").textContent = "الصق رابط الخريطة اللي أرسلته لك الوكالة (من رسالة الواتساب) واضغط «فتح». بعدها يفتح من الأيقونة على طول.";
  const i = $("code"); i.value = ""; i.removeAttribute("maxlength"); i.inputMode = "url"; i.placeholder = "الصق الرابط هنا"; i.dir = "ltr";
  i.style.cssText = "font-size:14px;letter-spacing:0;text-align:left"; i.setAttribute("aria-label", "رابط الخريطة");
  for (const x of document.querySelectorAll("#form .who")) x.remove();
  $("form").querySelector("button").textContent = "فتح";
  $("form").addEventListener("submit", e => { e.preventDefault(); const m = i.value.trim().match(/#([^\s#]+)/);
    if (!m) { $("msg").textContent = "هذا موب رابط الخريطة. انسخ الرابط كاملاً من رسالة الوكالة."; return; }
    location.hash = m[1]; location.reload(); });
}
function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function getFile() {
  try {
    // "no-cache" asks the server every time but downloads the file only when it changed (the page checks every minute).
    const r = await fetch(FILE, { cache: "no-cache" });
    if (r.status === 404) { if (window.caches) caches.delete(CACHE); throw "gone"; }
    if (!r.ok) throw 0;
    const net = Date.parse(r.headers.get("Date")); if (net > netSeen()) try { localStorage.setItem(NET, net); } catch {}
    const j = await r.clone().json();
    if (window.caches) caches.open(CACHE).then(c => c.put(FILE, r)).catch(() => {});
    return j;
  } catch (e) {
    if (e === "gone") throw e;
    const hit = window.caches && await caches.match(FILE); if (hit) return hit.json();
    throw "offline";
  }
}
// The code's slot in the map file (null when the code is wrong or was stopped by the agency).
async function slotFor(F, code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(F.s), iterations: 310000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const [iv, w] of F.k) { try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, key, b64(w)))); } catch {} }
  return null;
}
async function unlock(code, silent) {
  $("msg").textContent = silent ? "" : "جارٍ الفتح…";
  try {
    const F = await getFile(), slot = await slotFor(F, code);
    if (!slot) throw silent ? "stopped" : "code";
    if (now() >= slot.e) throw "expired";
    // A code made ahead for a later trip opens from its start (the arrival day).
    if (slot.s && now() < slot.s) { store.del(); $("msg").textContent = "هذا الرقم يبدأ " + new Date(slot.s).toLocaleString("ar", { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" }) + ". افتح الخريطة في وقتها."; return; }
    const raw = await openBody(F, slot);
    // iPhone: alerts need the map opened from the home screen, so it joins (and takes a place on the code) only there.
    if (raw.srv && isIOS && !standalone) { store.set(code); $("msg").textContent = ""; S = null; return gate(); }
    if (raw.srv) await join(raw.srv, code, ($("who") && $("who").value.trim()) || "");
    if (raw.svcAt) raw.svc = await getSvc(slot) || raw.svc; // markets and fuel stations: their own file next to the map's
    const daysSeen = JSON.stringify(raw.days || []); svcSeen = svcSig(raw); const T = await expand(raw);
    store.set(code); T.until = slot.e;
    render(T); watchExpiry(code, slot.e, F.v, daysSeen);
    if (S) { inbox(); setInterval(inbox, 30000); gate(); showShare(); locTick(); setInterval(locTick, 12e4); }
  } catch (e) {
    store.del();
    $("msg").textContent = MSG[e] || MSG.code;
  }
}
async function openBody(F, slot) {
  const dk = await crypto.subtle.importKey("raw", b64(slot.k), "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(F.v) }, dk, b64(F.d))));
}
// The map's markets and fuel stations (sealed with the same key), kept on the phone for use without internet.
const SFILE = `k/${ID}.s.json`;
async function getSvc(slot) {
  let F = null;
  try { const r = await fetch(SFILE, { cache: "no-cache" }); if (r.ok) { F = await r.clone().json(); if (window.caches) caches.open(CACHE).then(c => c.put(SFILE, r)).catch(() => {}); } } catch {}
  if (!F && window.caches) { const hit = await caches.match(SFILE); if (hit) F = await hit.json(); }
  try { return F ? await openBody(F, slot) : null; } catch { return null; }
}
// The code stops working at its expiry, even with the page open; and while online the page checks every minute that
// the agency has not stopped the code or deleted the map (either way it locks and asks for a new code), and picks up
// changes to the hotel and bus times.
let svcSeen = "";
const svcSig = B => B.svcAt ? "f" + B.svcAt : B.svc ? (B.svc.at || 0) + "" : "";
function watchExpiry(code, until, seen, daysSeen) {
  const lock = why => { store.del(); try { sessionStorage.setItem("map-expired", ID + "|" + why); } catch {} location.reload(); };
  const tick = () => {
    if (now() >= until) return lock("expired");
    const v = $("valid"); if (v) v.textContent = "صلاحية الرقم السري: " + fmtLeft(until - now());
  };
  const recheck = async () => {
    if (!navigator.onLine) return;
    try {
      const F = await getFile(), slot = await slotFor(F, code); if (!slot) return lock("stopped");
      if (F.v !== seen) { seen = F.v; const B = await openBody(F, slot);
        if (JSON.stringify(B.days || []) !== daysSeen || svcSig(B) !== svcSeen) return location.reload(); // a new program or new markets: open it again
        cur.T.hotel = B.hotel; cur.T.bus = B.bus || []; showHotel(); busTick(); }
      tick();
    } catch (e) { if (e === "gone") lock("gone"); }
  };
  tick(); setInterval(tick, 30000); setInterval(recheck, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); recheck(); } });
}
// Region map: the area's places are sealed in the map file with its settings (the full atlas is not public).
// Place row: [id, country, city, name, en, cat, gem01, desc, lat, lng, img, unesco01, descFromWikipedia01]
async function expand(B) {
  if (!B.places) throw "data";
  const S = r => ({ id: r[0], country: r[1], city: r[2], name: r[3], en: r[4], cat: r[5], gem: r[6] === 1, desc: r[7], lat: r[8], lng: r[9], img: r[10], unesco: r[11] === 1, wdesc: r[12] === 1 });
  B.area = B.places.map(S); delete B.places;
  const byId = new Map(B.area.map(s => [s.id, s]));
  B.area.push(...svcPlaces(B.svc, B.area));
  B.days = (B.days || []).map(d => ({ title: d.title || "", note: d.note || "", date: d.date || "",
    sites: d.sites.map(x => { const s = byId.get(x.id || x); return s ? { ...s, note: x.note || "" } : null; }).filter(Boolean) }));

function showShare() { const b = $("shareBtn"); if (b) b.textContent = sharing() ? "📍 موقعي يظهر لقائد الرحلة: إيقاف" : "📍 أظهر موقعي لقائد الرحلة"; }
document.addEventListener("click", e => { if (e.target.id !== "shareBtn") return; try { localStorage.setItem(SHARE, sharing() ? "0" : "1"); } catch {} showShare(); if (sharing()) { locSent = 0; locTick(true); } });
// Meeting points from the trip leader: a pin on the map with "go".
let points = [];

    .bindPopup(() => `<div class="pop">${p.img ? `<img src="${esc(S.url)}/img?id=${esc(p.img)}" alt="" onerror="this.remove()">` : ""}<b>${esc(p.place || "نقطة التقاء")}</b>${p.note ? `<div>${esc(p.note)}</div>` : ""}
      <div style="font-size:12px;color:#777">من قائد الرحلة</div>${Geo.last ? Geo.line(Geo.last, p) : ""}<button class="btn" onclick="goPoint(${p.id})">🧭 انطلق</button></div>`).addTo(pts);

function goPoint(id) { const p = points.find(x => x.id === id); if (p) Geo.guide({ name: p.place || "نقطة التقاء", city: "نقطة التقاء", lat: p.lat, lng: p.lng }); }
// Nearby services around my location or the map's center. Markets (malls included) and fuel stations come with the map
// itself (collected by the settings file), so they work offline and need no search. The other kinds are searched on
// OpenStreetMap when online (the last results are kept). Each kind also has a Google Maps search around the same spot.
const SERV = [["mosque", "🕌 مساجد", ["مسجد"], "مسجد"], ["exchange", "💱 صرافة", ["bureau de change"], "صرافة"], ["atm", "🏧 صراف آلي", ["atm"], "صراف آلي"],
  ["car", "🚗 تأجير سيارات", ["car rental"], "تأجير سيارات"], ["cinema", "🎬 سينما", ["cinema"], "سينما"], ["pharmacy", "💊 صيدليات", ["pharmacy"], "صيدلية"], ["hospital", "🏥 مستشفيات", ["hospital"], "مستشفى"]];
const SERVKEY = "map-serv-" + ID, serv = { cat: "mosque", km: 3, list: [] };
const gmaps = (term, at) => `https://www.google.com/maps/search/${encodeURIComponent(term)}/@${at.lat.toFixed(5)},${at.lng.toFixed(5)},15z`;
const wait = ms => new Promise(r => setTimeout(r, ms));
async function nomi(term, at, km) {
  const dy = km / 111, dx = dy / Math.cos(at.lat * Math.PI / 180), vb = [at.lng - dx, at.lat + dy, at.lng + dx, at.lat - dy].map(x => x.toFixed(4)).join(",");
  const stop = new AbortController(), tm = setTimeout(() => stop.abort(), 1e4);
  try { const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=40&bounded=1&accept-language=ar&viewbox=${vb}&q=${encodeURIComponent(term)}`, { signal: stop.signal });
    if (!r.ok) return null; return (await r.json()).map(x => ({ name: x.name || x.display_name.split(",")[0], lat: +(+x.lat).toFixed(5), lng: +(+x.lon).toFixed(5), addr: x.display_name.split(",").slice(1, 3).join("،").trim() })); }
  catch { return null; } finally { clearTimeout(tm); }
}
const dedup = list => { const seen = new Set(); return list.filter(s => { const k = s.name + "|" + s.lat.toFixed(4) + "|" + s.lng.toFixed(4); return !seen.has(k) && seen.add(k); }); };
async function search(kind, at, km) {
  let all = [], ok = false;
  for (const [n, term] of kind[2].entries()) { if (n) await wait(1100); const r = await nomi(term, at, km); if (r) { ok = true; all = all.concat(r); } } // one request a second
  return ok ? dedup(all) : null;
}
async function showServices() {
  layer.clearLayers(); cur.i = -2; $("day").onclick = null;
  const kind = SERV.find(x => x[0] === serv.cat), [key, label, , gterm] = kind, me = Geo.last, c = me || map.getCenter(), at = { lat: c.lat, lng: c.lng };
  const head = () => `<div class="day-head"><h2>🛎️ خدمات قريبة</h2><p>${me ? "حول موقعك" : "حول وسط الخريطة. اضغط «📍 موقعي» عشان تبحث حولك"}، في حدود ${serv.km} كم (تحتاج إنترنت).</p><p>🛍️⛽ الأسواق والمجمعات ومحطات الوقود تلقاها في «🗺️ خريطة المنطقة» مع الأماكن السياحية، وتطلع بدون إنترنت.</p></div>
    <div class="cats" id="scats">${SERV.map(([k, l]) => `<button class="chip" data-s="${k}" aria-pressed="${k === serv.cat}">${l}</button>`).join("")}</div>`;
  const bind = () => { $("scats").onclick = e => { const b = e.target.closest("[data-s]"); if (b) { serv.cat = b.dataset.s; serv.km = 3; showServices(); } }; };
  $("day").innerHTML = head() + '<p class="offline-note" style="padding:12px 16px">جارٍ البحث…</p>'; bind();
  const saved = ls.get(SERVKEY) || {};
  let list = navigator.onLine ? await search(kind, at, serv.km) : null, note = "";
  if (list) { saved[key] = { at, list, when: Date.now() }; ls.set(SERVKEY, saved); }
  else if (saved[key]) { list = saved[key].list; note = "بدون إنترنت: هذي آخر نتائج محفوظة على جوالك."; }
  if (cur.i !== -2) return; // the traveler moved to another tab meanwhile
  const gBtn = navigator.onLine ? `<div style="padding:4px 16px 12px"><a class="btn ghost" style="width:100%" target="_blank" rel="noopener" href="${gmaps(gterm, at)}">🔎 ابحث عن ${esc(gterm)} في خرائط جوجل</a></div>` : "";
  if (!list) { $("day").innerHTML = head() + `<p class="offline-note" style="padding:12px 16px">${navigator.onLine ? "خدمة البحث مشغولة الحين. استخدم زر خرائط جوجل:" : "تحتاج إنترنت للبحث عن هذي الخدمة."}</p>` + gBtn; bind(); return; }
  list = list.slice().sort((a, b) => Geo.km(at, a) - Geo.km(at, b)); serv.list = list;
  const icon = label.split(" ")[0];
  for (const [n, s] of list.slice(0, 80).entries()) L.marker([s.lat, s.lng], { icon: L.divIcon({ className: "", iconSize: [26, 26], html: `<div class="hpin" style="font-size:20px;line-height:26px">${icon}</div>` }) })
    .bindPopup(`<div class="pop"><b>${esc(s.name)}</b>${s.addr ? `<div>${esc(s.addr)}</div>` : ""}${Geo.last ? Geo.line(Geo.last, s) : ""}<button class="btn" onclick="goServ(${n})">🧭 انطلق</button></div>`).addTo(layer);
  if (list.length) map.fitBounds(L.latLngBounds(list.slice(0, 15).map(s => [s.lat, s.lng]).concat([[at.lat, at.lng]])).pad(0.15), { maxZoom: 16 });
  $("day").innerHTML = head() + (note ? `<p class="offline-note" style="padding:8px 16px 0">${note}</p>` : "")
    + (list.length ? list.slice(0, 40).map((s, n) => `<article class="place" style="grid-template-columns:44px 1fr"><div class="thumb ph" style="width:44px;height:44px;font-size:22px;background:var(--bg)">${icon}</div>
      <div><h3>${esc(s.name)}</h3><div class="meta">${Geo.km(at, s).toFixed(1)} كم${s.addr ? " · " + esc(s.addr) : ""}</div>
      <div class="go"><button class="btn" onclick="goServ(${n})">🧭 انطلق</button><button class="btn ghost" data-sv="${n}">على الخريطة</button></div></div></article>`).join("")
      : `<p class="offline-note" style="padding:12px 16px">ما لقينا ${esc(gterm)} في حدود ${serv.km} كم.</p>`)
    + gBtn + (serv.km < 20 && navigator.onLine ? `<button class="btn ghost more" id="wider">وسّع البحث إلى ${serv.km < 10 ? 10 : 25} كم</button>` : "");

function goServ(n) { const s = serv.list[n], k = SERV.find(x => x[0] === serv.cat); if (s) Geo.guide({ name: s.name, city: k[3], lat: s.lat, lng: s.lng }); }

async function saveOffline(T) {
  try {
    if (!("serviceWorker" in navigator) || !window.caches) return;
    await navigator.serviceWorker.ready;
    const c = await caches.open(CACHE);
    const urls = [location.href.split("#")[0], "../../vendor/leaflet.js", "../../geo.js?v=mw281u6l", "../../vendor/leaflet.css", "../../style.css?v=mw281u6l", "manifest.webmanifest", "manifest-a.webmanifest", "../../icons/map-192.png"]
      .map(u => new URL(u, location.href).href);

    await Promise.all(urls.map(u => c.add(u).catch(() => {})));

  } catch {}

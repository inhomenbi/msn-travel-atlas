<style>
body { overflow: auto; }
.lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(160deg, var(--brand), #08303a); }
.lock .box { background: var(--panel); border-radius: 20px; padding: 28px 24px; width: min(380px, 100%); text-align: center; box-shadow: var(--shadow); }
.lock h1 { margin: 0 0 6px; font-size: 22px; color: var(--brand); }
.lock p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.7; }
.lock input { width: 100%; height: 52px; font-size: 26px; letter-spacing: 8px; text-align: center; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); direction: ltr; }
.lock .btn { width: 100%; margin-top: 12px; height: 48px; font-size: 16px; }
.lock .msg { min-height: 22px; margin-top: 10px; color: var(--warn); font-size: 14px; }
.trip { display: none; max-width: 980px; margin: 0 auto; padding-bottom: 90px; }
.trip header { background: var(--brand); color: var(--brand-ink); padding: 22px 18px 18px; }
.trip header small { opacity: .85; display: flex; align-items: center; gap: 8px; }
.logo { height: 40px; max-width: 120px; object-fit: contain; background: #fff; border-radius: 8px; padding: 3px; }
.lock .logo { height: 64px; max-width: 180px; margin-bottom: 10px; }
.trip header h1 { margin: 4px 0; font-size: 24px; }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; position: sticky; top: 0; background: var(--bg); z-index: 500; border-bottom: 1px solid var(--line); }
.days .chip { white-space: nowrap; }
#tmap { height: 46vh; min-height: 280px; }
.day-head { padding: 16px 16px 4px; }
.day-head h2 { margin: 0; font-size: 19px; } .day-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stop { background: var(--panel); margin: 12px 16px; border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.06); border: 1px solid var(--line); }
.stop img { width: 100%; height: 220px; object-fit: cover; display: block; background: var(--line); }
.stop .body { padding: 14px 16px 16px; }
.stop h3 { margin: 0; font-size: 18px; display: flex; gap: 10px; align-items: center; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: 14px; }
.stop .meta { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
.stop p { margin: 0 0 12px; line-height: 1.85; }
.leg { text-align: center; color: var(--muted); font-size: 12.5px; }
.npin { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
.dock { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); z-index: 1000; justify-content: center; }
.dock .btn { flex: 1; max-width: 300px; }
.offline-note { font-size: 12.5px; color: var(--muted); padding: 0 16px; }
.place { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--panel); margin: 10px 16px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); }
.place h3 { margin: 0; font-size: 16px; } .place .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 4px; }
.place p { margin: 4px 0 8px; font-size: 13.5px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.place .go { display: flex; gap: 8px; } .place .btn { height: 36px; padding: 0 12px; font-size: 13.5px; }
.place.near { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.25); }
.cats { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 2px; }
.cats .chip { white-space: nowrap; } .more { display: block; margin: 8px auto 16px; }
.pop { text-align: right; min-width: 180px; } .pop img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 6px; }
.pop .btn { height: 34px; margin-top: 8px; width: 100%; color: #fff; }
.apps { background: var(--panel); margin: 12px 16px; border-radius: var(--radius); border: 1px solid var(--line); padding: 14px 16px; }
.apps h2 { margin: 0 0 4px; font-size: 16px; } .apps p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; line-height: 1.8; }
.apps .row { display: flex; gap: 8px; flex-wrap: wrap; } .apps .btn { flex: 1; min-width: 150px; }
.hpin { font-size: 26px; line-height: 32px; text-align: center; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.busbar { display: none; align-items: center; gap: 10px; background: #fff4d6; color: #5c3d00; border-bottom: 1px solid #f0d58c; padding: 10px 16px; font-size: 14.5px; line-height: 1.6; }
.busbar.on { display: flex; } .busbar b { font-size: 16px; } .busbar.soon { background: #ffe1dc; color: #7a1408; border-color: #f3b2a8; }
.buslist { margin: 0 0 10px; padding: 0; list-style: none; } .buslist li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.buslist li.past { color: var(--muted); text-decoration: line-through; }
.alarm { position: fixed; inset: 0; z-index: 5000; display: grid; place-items: center; padding: 24px; background: rgba(160, 20, 8, .94); color: #fff; text-align: center; }
.alarm .box { width: min(420px, 100%); } .alarm .big { font-size: 64px; } .alarm h2 { margin: 8px 0; font-size: 26px; } .alarm p { font-size: 18px; line-height: 1.8; margin: 0 0 20px; }
.alarm .btn { width: 100%; height: 52px; font-size: 18px; background: #fff; color: #7a1408; }
</style>
</head>
<body>
<section class="lock" id="lock">
  <div class="box">
    <img class="logo" id="lockLogo" alt="" hidden><h1 id="lockTitle">خريطتك السياحية</h1>
    <p id="lockText">أدخل الرقم السري الذي أرسلته لك الوكالة لفتح خريطتك.</p>
    <form id="form"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" aria-label="الرقم السري" required>
    <button class="btn" type="submit">افتح الخريطة</button></form>
    <div class="msg" id="msg" role="alert"></div>
  </div>
</section>
<main class="trip" id="trip"></main>
<script src="../../vendor/leaflet.js"></script>
<script src="../../geo.js?v=mw0j5db0"></script>
<script>
// Map page t/m/#<id>. The map's settings and secret codes live in k/<id>.json, written by the agency's settings file:
// the settings are sealed (AES-GCM) with a data key, and each code slot holds that key plus the code's expiry time,
// sealed with a key derived from the code (PBKDF2-SHA256). When a code's time runs out the page locks itself and asks
// for a new code. The file is fetched fresh when online and kept on the phone for offline use; a deleted map stops opening.
const ID = location.hash.slice(1).replace(/[^\w-]/g, "");
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const KEY = "map-code-" + ID, FILE = `k/${ID}.json`, CACHE = "trip-m-" + ID;
// Clock that cannot be wound back: every time the page is online it keeps the internet time (the server's Date header),
// and "now" is never earlier than the latest internet time seen. Setting the phone's date back after that does not
// bring an expired code back to life.
const NET = "map-net-time";
const netSeen = () => { try { return +localStorage.getItem(NET) || 0; } catch { return 0; } };
const now = () => Math.max(Date.now(), netSeen());
// The agency's name and logo are sealed with the map; kept on the phone after the first opening so the lock screen shows them.
const BRAND = "map-brand-" + ID, brandOf = T => ({ name: T.brand || "MSN Travel", logo: T.logo || "" });
try { const b = JSON.parse(localStorage.getItem(BRAND)); if (b) { $("lockTitle").textContent = "خريطتك السياحية من " + b.name; document.title = b.name;
  if (b.logo) { $("lockLogo").src = b.logo; $("lockLogo").hidden = false; } } } catch {}
const store = { get: () => { try { return localStorage.getItem(KEY); } catch { return null; } },
  set: v => { try { localStorage.setItem(KEY, v); } catch {} }, del: () => { try { localStorage.removeItem(KEY); } catch {} } };
const MSG = { code: "الرقم السري غير صحيح، حاول مرة أخرى.", expired: "انتهت صلاحية الرقم السري. اطلب رقماً جديداً من الوكالة وأدخله هنا.",
  gone: "أوقفت الوكالة هذه الخريطة.", stopped: "أوقفت الوكالة هذا الرقم السري. اطلب رقماً جديداً وأدخله هنا.", offline: "اتصل بالإنترنت مرة واحدة لفتح الخريطة أول مرة.", data: "تعذر تحميل بيانات الخريطة. اتصل بالإنترنت ثم حاول." };
const fmtLeft = ms => { const m = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
  return [d && d + " يوم", h && h + " ساعة", (m % 60 || !(d || h)) && (m % 60) + " دقيقة"].filter(Boolean).join(" و").replace(/^0 دقيقة$/, "أقل من دقيقة"); };

if (!ID) { $("lockText").textContent = "الرابط غير مكتمل. افتح الرابط كاملاً كما أرسلته لك الوكالة."; $("form").remove(); }
else {
  try { const [id, why] = (sessionStorage.getItem("map-expired") || "").split("|");
    if (id === ID) { sessionStorage.removeItem("map-expired"); $("msg").textContent = MSG[why] || MSG.expired; } } catch {}
  const saved = store.get(); if (saved) unlock(saved, true);
  $("form").addEventListener("submit", e => { e.preventDefault(); unlock($("code").value.trim(), false); });
}

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function getFile() {
  try {
    // "no-cache" asks the server every time but downloads the file only when it changed (the page checks every minute).
    const r = await fetch(FILE, { cache: "no-cache" });
    if (r.status === 404) { if (window.caches) caches.delete(CACHE); throw "gone"; }
    if (!r.ok) throw 0;
    const net = Date.parse(r.headers.get("Date")); if (net > netSeen()) try { localStorage.setItem(NET, net); } catch {}
    const j = await r.clone().json();
    if (window.caches) caches.open(CACHE).then(c => c.put(FILE, r)).catch(() => {});
    return j;
  } catch (e) {
    if (e === "gone") throw e;
    const hit = window.caches && await caches.match(FILE); if (hit) return hit.json();
    throw "offline";
  }
}
// The code's slot in the map file (null when the code is wrong or was stopped by the agency).
async function slotFor(F, code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(F.s), iterations: 310000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const [iv, w] of F.k) { try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, key, b64(w)))); } catch {} }
  return null;
}
async function unlock(code, silent) {
  $("msg").textContent = silent ? "" : "جارٍ الفتح…";
  try {
    const F = await getFile(), slot = await slotFor(F, code);
    if (!slot) throw silent ? "stopped" : "code";
    if (now() >= slot.e) throw "expired";
    const T = await expand(await openBody(F, slot));
    store.set(code); T.until = slot.e;
    render(T); watchExpiry(code, slot.e, F.v);
  } catch (e) {
    store.del();
    $("msg").textContent = MSG[e] || MSG.code;
  }
}
async function openBody(F, slot) {
  const dk = await crypto.subtle.importKey("raw", b64(slot.k), "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(F.v) }, dk, b64(F.d))));
}
// The code stops working at its expiry, even with the page open; and while online the page checks every minute that
// the agency has not stopped the code or deleted the map (either way it locks and asks for a new code), and picks up
// changes to the hotel and bus times.
function watchExpiry(code, until, seen) {
  const lock = why => { store.del(); try { sessionStorage.setItem("map-expired", ID + "|" + why); } catch {} location.reload(); };
  const tick = () => {
    if (now() >= until) return lock("expired");
    const v = $("valid"); if (v) v.textContent = "صلاحية الرقم السري: " + fmtLeft(until - now());
  };
  const recheck = async () => {
    if (!navigator.onLine) return;
    try {
      const F = await getFile(), slot = await slotFor(F, code); if (!slot) return lock("stopped");
      if (F.v !== seen) { seen = F.v; const B = await openBody(F, slot); cur.T.hotel = B.hotel; cur.T.bus = B.bus || []; showHotel(); busTick(); }
      tick();
    } catch (e) { if (e === "gone") lock("gone"); }
  };
  tick(); setInterval(tick, 30000); setInterval(recheck, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); recheck(); } });
}
// Region map: the area's places are sealed in the map file with its settings (the full atlas is not public).
// Place row: [id, country, city, name, en, cat, gem01, desc, lat, lng, img, unesco01, descFromWikipedia01]
async function expand(B) {
  if (!B.places) throw "data";
  const S = r => ({ id: r[0], country: r[1], city: r[2], name: r[3], en: r[4], cat: r[5], gem: r[6] === 1, desc: r[7], lat: r[8], lng: r[9], img: r[10], unesco: r[11] === 1, wdesc: r[12] === 1 });
  B.area = B.places.map(S); delete B.places;
  const byId = new Map(B.area.map(s => [s.id, s]));
  B.days = (B.days || []).map(d => ({ title: d.title || "", note: d.note || "",
    sites: d.sites.map(x => { const s = byId.get(x.id || x); return s ? { ...s, note: x.note || "" } : null; }).filter(Boolean) }));
  return B;
}
// Saved copies of the old public atlas data (before places were sealed in the map file) are removed from the phone.
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.open(k).then(c => c.keys().then(rs => rs.forEach(r => { if (/\/data\/sites\.json/.test(r.url)) c.delete(r); }))))).catch(() => {});

function km(a, b) { const r = Math.PI / 180, x = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lng - a.lng) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); }
let map, layer, fixed, cur = { T: null, i: 0 }, geoAt = null, geoTimes = null;
function render(T) {
  const B = brandOf(T); try { localStorage.setItem(BRAND, JSON.stringify(B)); } catch {}
  document.title = T.title + " | " + B.name;
  T.area = T.area || []; T.days = T.days || []; T.countries = T.countries || [];
  $("lock").remove(); const el = $("trip"); el.style.display = "block";
  el.innerHTML = `<header><small>${B.logo ? `<img class="logo" src="${esc(B.logo)}" alt="">` : ""}${esc(B.name)}</small><h1>${esc(T.title)}</h1>
      <div>${T.traveler ? esc(T.traveler) + " · " : ""}<span id="valid"></span></div></header>
    <div class="busbar" id="busbar"></div>
    <nav class="days" id="days">${T.area.length ? `<button class="chip" data-i="-1" aria-pressed="${!T.days.length}">🗺️ خريطة المنطقة</button>` : ""}${T.days.map((d, i) => `<button class="chip" data-i="${i}" aria-pressed="${i === 0}">اليوم ${i + 1}</button>`).join("")}</nav>
    <div id="tmap"></div><div id="day"></div>
    <section class="apps" id="busCard" hidden><h2>🚌 مواعيد الباص</h2><ul class="buslist" id="busList"></ul>
      <p>الخريطة ترن قبل موعد الباص بـ 15 و 5 دقائق وهي مفتوحة. ولو قفلت الشاشة أو ما عندك إنترنت، أضف المواعيد لتقويم جوالك فيرن لك التقويم في وقتها.</p>
      <div class="row"><button class="btn" id="busCal">📅 أضف المواعيد لتقويم جوالي</button><button class="btn ghost" id="busOn">🔔 فعّل صوت التنبيه</button></div>
      <p class="offline-note" id="busNote" style="padding:8px 0 0"></p></section>
    <section class="apps"><h2>بدون إنترنت</h2>
      <p>للملاحة والـ GPS بدون نت: ثبّت تطبيق <b>maps.me</b> أو <b>Organic Maps</b> وحمّل فيه خريطة الدولة، ثم اضغط الزر تحت وافتح الملف بالتطبيق، فتنضاف محطات رحلتك وكل أماكن المنطقة للمفضلة وتقدر توصل لها خطوة بخطوة بدون إنترنت.</p>
      <div class="row"><button class="btn" id="kml">🗺️ محطات الرحلة والمنطقة لتطبيق الخرائط</button>
      <button class="btn ghost" id="save">حفظ هذه الصفحة بدون إنترنت</button></div></section>
    <p class="offline-note" id="off"></p>
    <div class="dock">${T.phone ? `<a class="btn" href="https://wa.me/${esc(T.phone.replace(/\D/g, ""))}" target="_blank" rel="noopener">💬 واتساب</a>` : ""}
      <button class="btn ghost" id="hotelBtn" hidden>🏨 الفندق</button>
      <button class="btn ghost" id="locBtn">📍 موقعي</button>
</div>`;
  map = L.map("tmap", { zoomControl: false });
  L.control.zoom({ position: "topleft" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
  layer = L.layerGroup().addTo(map); fixed = L.layerGroup().addTo(map);
  $("hotelBtn").addEventListener("click", goHotel);
  $("busCal").addEventListener("click", () => busCalendar(T, B));
  $("busOn").addEventListener("click", busAllow);
  $("days").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (!b) return;
    for (const x of $("days").children) x.setAttribute("aria-pressed", x === b);
    const i = +b.dataset.i; i < 0 ? showArea(T) : showDay(T, i); });
  $("save").addEventListener("click", () => saveOffline(T));
  // All trip stops as bookmarks for maps.me / Organic Maps, one colour per day.
  const COLORS = ["red", "blue", "green", "purple", "orange", "pink", "brown", "yellow"];
  $("kml").addEventListener("click", () => Geo.download("رحلة " + T.title, Geo.kml(B.name + " - " + T.title, T.days.flatMap((d, i) => d.sites.map((s, n) => ({
    name: `اليوم ${i + 1} - ${n + 1}. ${s.name}`, desc: [s.desc, s.note && "ملاحظة: " + s.note, `${s.city} - ${s.country}`].filter(Boolean).join("\n\n"),
    lat: s.lat, lng: s.lng, color: COLORS[i % COLORS.length] })))
    .concat(T.area.map(s => ({ name: (s.gem ? "★ " : "") + s.name, desc: `${s.desc}\n\n${s.city} - ${s.country} · ${s.cat}`, lat: s.lat, lng: s.lng, color: APP_COLOR[s.cat] })))
    .concat(T.hotel ? [{ name: "🏨 " + T.hotel.name, desc: "فندقك", lat: T.hotel.lat, lng: T.hotel.lng, color: "red" }] : []))));
  const Locate = L.Control.extend({ options: { position: "topleft" }, onAdd: () => {
    const b = L.DomUtil.create("button", "locate leaflet-bar"); b.title = "موقعي"; b.setAttribute("aria-label", "موقعي"); b.textContent = "◎";
    L.DomEvent.on(b, "click", e => { L.DomEvent.stop(e); startLocate(); }); return b; } });
  map.addControl(new Locate());
  $("locBtn").addEventListener("click", startLocate);
  cur.T = T; T.days.length ? showDay(T, 0) : showArea(T);
  showHotel(); busTick(); setInterval(busTick, 15000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js", { scope: "../../" }).catch(() => {});
}
// Area map (pocket guide): every atlas place in the trip's countries; tap one and go. Sorted nearest first once located.
const CAT_COLOR = { "تاريخي": "#a52714", "طبيعي": "#097138", "ديني": "#0288d1", "ثقافي": "#9c27b0", "متحف": "#f57c00",
  "معماري": "#455a64", "ترفيهي": "#e91e63", "قرية/بلدة": "#795548", "تسوق": "#d4a017" };
const APP_COLOR = { "تاريخي": "red", "طبيعي": "green", "ديني": "blue", "ثقافي": "purple", "متحف": "orange", "معماري": "brown",
  "ترفيهي": "pink", "قرية/بلدة": "brown", "تسوق": "yellow" };
const area = { cat: "", shown: 30, list: [], at: null };
function showArea(T, keep) {
  layer.clearLayers(); cur.i = -1; geoTimes = null; geoAt = null;
  if (!keep) area.shown = 30;
  const me = Geo.last;
  area.list = T.area.filter(s => !area.cat || s.cat === area.cat);
  if (me) area.list.sort((a, b) => Geo.km(me, a) - Geo.km(me, b));
  for (const s of area.list) s.m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: "", iconSize: [16, 16],
    html: `<div class="pin${s.gem ? " gem" : ""}" style="background:${CAT_COLOR[s.cat] || "#555"}"></div>` }) })

function showDay(T, i) {

// My location: blue dot, distance and driving / walking time to each stop of the shown day, nearest stop marked.
// "Go" opens the offline guide screen (GPS + compass), from the map popups, area cards and day stops.

function goTo(k, n) { Geo.guide(k === "a" ? area.list[n] : cur.T.days[cur.i].sites[n]); }
function startLocate() { Geo.locate(map, updateEta); }
async function updateEta(me) {
  if (cur.i < 0 && (!area.at || Geo.km(area.at, me) > 1)) { area.at = me; showArea(cur.T, true); return; } // re-sort nearest first
  const stops = cur.i < 0 ? area.list.slice(0, area.shown) : cur.T.days[cur.i].sites;
  const moved = !geoAt || Geo.km(geoAt, me) > 0.3;
  const paint = () => {
    let best = -1, bestD = Infinity;
    stops.forEach((s, n) => { const d = Geo.km(me, s); if (d < bestD) { bestD = d; best = n; } });
    document.querySelectorAll(".eta-slot").forEach(el => {
      const n = +el.dataset.n; el.innerHTML = Geo.line(me, stops[n], geoTimes && geoTimes[n]) + (n === best ? '<span class="badge">الأقرب إليك</span>' : "");
      el.closest(".stop, .place").classList.toggle("near", n === best);
    });
  };
  paint();
  if (moved) { const day = cur.i; geoAt = me; const t = await Geo.times(me, stops.slice(0, 50)); if (day === cur.i) { geoTimes = t; paint(); } }
}
// Hotel: always on the map, and "🏨 الفندق" opens the guide screen back to it.
function goHotel() { const h = cur.T.hotel; if (h) Geo.guide({ name: h.name, city: "فندقك", lat: h.lat, lng: h.lng }); }
function showHotel() {
  const h = cur.T.hotel; fixed.clearLayers(); $("hotelBtn").hidden = !h; if (!h) return;
  L.marker([h.lat, h.lng], { zIndexOffset: 1000, icon: L.divIcon({ className: "", iconSize: [32, 32], html: '<div class="hpin">🏨</div>' }) })
    .bindPopup(`<div class="pop"><b>${esc(h.name)}</b><div>فندقك</div>${Geo.last ? Geo.line(Geo.last, h) : ""}<button class="btn" onclick="goHotel()">🏨 ارجع للفندق</button></div>`).addTo(fixed);

// Bus departures set by the agency: a countdown bar, a list, and an alarm (sound, vibration, notification) 15 and 5
// minutes before and at the time, while the page is open. A closed page cannot ring, so the times can also go into the
// phone's calendar, which rings on its own, with no internet.
const busFmt = t => new Date(t).toLocaleString("ar", { weekday: "long", hour: "numeric", minute: "2-digit" });
const FIRED = "map-bus-" + ID;
let audio = null;
function showBus() {
  const all = (cur.T.bus || []).slice().sort((a, b) => a.t - b.t), next = all.find(b => b.t > now() - 10 * 6e4);
  $("busCard").hidden = !all.length;
  $("busList").innerHTML = all.map(b => `<li class="${b.t < now() - 10 * 6e4 ? "past" : ""}">🚌 ${esc(busFmt(b.t))}${b.place ? " · " + esc(b.place) : ""}</li>`).join("");
  const bar = $("busbar"), left = next && next.t - now();
  bar.classList.toggle("on", !!next && left < 864e5); bar.classList.toggle("soon", !!next && left < 15 * 6e4);
  if (next) bar.innerHTML = `<span style="font-size:24px">🚌</span><div><b>الباص يتحرك ${left > 0 ? "بعد " + fmtLeft(left) : "الحين"}</b><br>${esc(busFmt(next.t))}${next.place ? " من " + esc(next.place) : ""}</div>`;
}
function busTick() {
  showBus(); let fired; try { fired = JSON.parse(localStorage.getItem(FIRED)) || []; } catch { fired = []; }
  for (const b of cur.T.bus || []) {
    if (now() >= b.t + 10 * 6e4) continue;
    // Warnings due now (15 / 5 minutes before, at the time); one alarm even if the page was opened late and several are due.
    const due = [15, 5, 0].filter(m => now() >= b.t - m * 6e4).map(m => b.t + "|" + m);
    if (!due.length || due.every(k => fired.includes(k))) continue;
    fired.push(...due.filter(k => !fired.includes(k))); try { localStorage.setItem(FIRED, JSON.stringify(fired.slice(-60))); } catch {}
    return busAlarm(b);
  }
}
function busAlarm(b) {
  const title = b.t - now() >= 6e4 ? `الباص يتحرك بعد ${fmtLeft(b.t - now())}` : "الباص يتحرك الحين", body = (b.place ? "من " + b.place + ". " : "") + "توجّه للباص.";
  document.querySelector(".alarm")?.remove();
  const el = document.createElement("div"); el.className = "alarm"; el.setAttribute("role", "alertdialog");
  el.innerHTML = `<div class="box"><div class="big">🚌</div><h2>${esc(title)}</h2><p>${esc(busFmt(b.t))}<br>${esc(body)}</p><button class="btn">تمام، رايح للباص</button></div>`;
  document.body.append(el);

  el.querySelector("button").onclick = () => { el.remove(); navigator.vibrate?.(0); };

    r.showNotification("🚌 " + title, { body, tag: "bus-" + b.t, renotify: true, requireInteraction: true, vibrate: [400, 200, 400] })).catch(() => {});
}
function beep() {

    for (let i = 0; i < 3; i++) { const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * .35;
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.4, t); g.gain.exponentialRampToValueAtTime(.001, t + .3); o.start(t); o.stop(t + .3); } } catch {}
}
// Phones only allow sound after a tap, and notifications after asking.
document.addEventListener("pointerdown", () => { try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {} }, { once: true });
async function busAllow() {
  beep();
  let ok = false; if (window.Notification) ok = Notification.permission === "granted" || await Notification.requestPermission() === "granted";
  $("busNote").textContent = ok ? "✓ تم. خلّ الصفحة مفتوحة وقت الجولة، وبتسمع صوت مثل هذا وتوصلك إشعار قبل موعد الباص."
    : "✓ الصوت شغال وقت الصفحة مفتوحة. الإشعارات ما تشتغل في هذا المتصفح (في الآيفون لازم تضيف الصفحة للشاشة الرئيسية)، فالأضمن تضيف المواعيد لتقويم جوالك.";

function busCalendar(T, B) {
  const up = (T.bus || []).filter(b => b.t > now()); if (!up.length) { $("busNote").textContent = "ما فيه مواعيد قادمة للباص حالياً."; return; }
  const f = t => new Date(t).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, ""), x = t => String(t).replace(/[\\;,]/g, "\\$&").replace(/\n/g, "\\n");
  const alarm = m => ["BEGIN:VALARM", "ACTION:DISPLAY", `TRIGGER:-PT${m}M`, `DESCRIPTION:${x(`الباص يتحرك بعد ${m} دقيقة`)}`, "END:VALARM"];
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MSN Travel//Map//AR", "METHOD:PUBLISH", ...up.flatMap(b => ["BEGIN:VEVENT", `UID:${ID}-${b.t}@msn-travel`,
    `DTSTAMP:${f(Date.now())}`, `DTSTART:${f(b.t)}`, `DTEND:${f(b.t + 15 * 6e4)}`, `SUMMARY:${x("🚌 الباص يتحرك" + (b.place ? " من " + b.place : ""))}`,
    `DESCRIPTION:${x(B.name + " - " + T.title)}`, ...alarm(15), ...alarm(5), "END:VEVENT"]), "END:VCALENDAR"].join("\r\n");

  $("busNote").textContent = "افتح الملف اللي نزل واختر «إضافة للتقويم». إذا غيّرت الوكالة المواعيد، اضغط الزر مرة ثانية.";
}
// Saves this page, the photos and the map tiles already viewed. Map tiles are kept as you browse the map online.
async function saveOffline(T) {
  const btn = $("save"); btn.disabled = true; btn.textContent = "جارٍ الحفظ…";
  try {
    if (!("serviceWorker" in navigator) || !window.caches) throw 0;
    await navigator.serviceWorker.ready;
    const c = await caches.open(CACHE);
    const urls = [location.href.split("#")[0], "../../vendor/leaflet.js", "../../geo.js?v=mw0j5db0", "../../vendor/leaflet.css", "../../style.css?v=mw0j5db0", "manifest.webmanifest"]
      .map(u => new URL(u, location.href).href);

    await Promise.all(urls.map(u => c.add(u).catch(() => {})));

  } catch { btn.disabled = false; btn.textContent = "حفظ للاستخدام بدون إنترنت"; $("off").textContent = "تعذر الحفظ على هذا المتصفح. جرّب Safari أو Chrome."; }
}
